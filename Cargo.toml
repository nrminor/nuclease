[package]
name = "nuclease"
version = "0.6.0"
description = "Streaming FASTQ preprocessor with a focus on extensibility"
authors = ["Nicholas Minor <nrminor@wisc.edu>"]
edition = "2024"
license = "MIT"
rust-version = "1.95.0"
repository = "https://github.com/nrminor/nuclease"
homepage = "https://github.com/nrminor/nuclease"
documentation = "https://docs.rs/nuclease"
readme = "README.md"
keywords = ["fastq", "ena", "bioinformatics", "preprocessing", "sequencing"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "nuclease"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
color-eyre = "0.6.5"
bumpalo = "3.17.0"
bytecount = "0.6.9"
flate2 = "1.1.5"
needletail = "0.7.3"
reqwest = { version = "0.12.24", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.7"
wide = "1.3.0"
indicatif = "0.18.4"
libpairassembly = { version = "0.1.2", default-features = false }

[dev-dependencies]
tempfile = "3.23.0"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
unwrap_used = "deny"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = "warn"

[profile.dev]
incremental = true
lto = false

[profile.release]
lto = true
codegen-units = 1
strip = true
